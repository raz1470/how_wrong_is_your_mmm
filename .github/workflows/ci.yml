name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-default-groups --group test --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --no-default-groups --group test --python ${{ matrix.python-version }} pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --no-default-groups --group test

      - name: Ruff format check
        run: uv run --no-default-groups --group test ruff format --check .

      - name: Ruff lint
        run: uv run --no-default-groups --group test ruff check .

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium

      # Renders docs/overview.html headless at 1440px and 393px and fails on:
      # an empty chart, text rendering below 9px, text escaping its SVG box,
      # labels colliding with each other or a legend swatch, NaN/undefined
      # attributes, or console errors. Chart font sizes are declared in viewBox
      # units, so a layout constant tuned for one font size breaks silently
      # when another changes - this is what catches that.
      - name: Check chart legibility
        run: node tools/check_charts.js
